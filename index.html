<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1"/>
<meta name="theme-color" content="#f6f7f9"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>Pack — Dog Sitting</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f6f7f9;--bg2:#eef0f4;--card:#fff;--card2:#f8f9fb;
  --border:#e2e5ea;--border2:#cfd4dc;
  --text:#16181d;--sub:#6b7280;--mute:#d7dbe2;
  --ac:#7c5cff;--ac2:#6844f5;--ac-bg:#f1edff;--ac-bd:#d9cfff;
  --ok:#0e9f6e;--ok-bg:#e6f6ef;--warn:#b45309;--warn-bg:#fdf3e3;--bad:#dc2626;--bad-bg:#fdecec;
  --r:14px;--rs:10px;
}
html,body{background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',sans-serif;
  font-size:15px;line-height:1.5;min-height:100dvh;overscroll-behavior:none}
body{padding-bottom:calc(70px + env(safe-area-inset-bottom))}
input,select,textarea,button{font-family:inherit}

/* header */
.hdr{position:sticky;top:0;z-index:50;background:var(--bg);
  border-bottom:1px solid var(--border);padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
.hdr-in{display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{font-size:17px;font-weight:900;letter-spacing:-.02em}
.logo span{color:var(--ac)}
.hdr-sub{font-size:11px;color:var(--sub);font-weight:600;margin-top:1px}

/* tabs */
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:60;display:flex;
  background:var(--card);border-top:1px solid var(--border);
  padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;background:none;border:none;color:var(--sub);cursor:pointer;
  font-size:10px;font-weight:700;padding:9px 2px 8px;display:flex;
  flex-direction:column;align-items:center;gap:3px;transition:color .15s}
.tab .ico{font-size:19px;line-height:1}
.tab.on{color:var(--ac)}
.page{display:none;padding:14px 14px 20px}
.page.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* generic */
.sh{font-size:10px;font-weight:800;letter-spacing:.09em;color:var(--sub);
  text-transform:uppercase;margin:18px 2px 8px}
.sh:first-child{margin-top:2px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px}
.btn{width:100%;background:var(--ac);border:none;border-radius:var(--rs);color:#fff;
  font-size:15px;font-weight:800;padding:13px;cursor:pointer;transition:transform .12s,opacity .15s}
.btn:active{transform:scale(.985);opacity:.92}
.btn.ghost{background:none;border:1px solid var(--border2);color:var(--sub)}
.btn.danger{background:none;border:1px solid var(--bad);color:var(--bad)}
.btn.sm{padding:9px;font-size:13px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.lbl{display:block;font-size:10px;font-weight:800;letter-spacing:.07em;
  color:var(--sub);text-transform:uppercase;margin:12px 0 5px}
.in{width:100%;background:var(--card);border:1px solid var(--border2);border-radius:var(--rs);
  color:var(--text);padding:11px 12px;font-size:16px;outline:none;-webkit-appearance:none;
  transition:border-color .15s,box-shadow .18s}
.in:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--ac-bg)}
textarea.in{resize:vertical;min-height:64px;font-size:15px}
.err{font-size:12px;color:var(--bad);min-height:15px;margin-top:6px}
.empty{text-align:center;padding:26px 14px;color:var(--sub);font-size:13px;line-height:1.6}
.pill{display:inline-block;font-size:9px;font-weight:800;letter-spacing:.05em;
  padding:3px 8px;border-radius:99px;text-transform:uppercase}
.pill.rover{background:var(--ac-bg);color:var(--ac2)}
.pill.direct{background:var(--ok-bg);color:var(--ok)}
.pill.paid{background:var(--ok-bg);color:var(--ok)}
.pill.unpaid{background:var(--warn-bg);color:var(--warn)}
.pill.done{background:var(--bg2);color:var(--sub)}
.pill.active{background:var(--ok-bg);color:var(--ok)}
.pill.upcoming{background:var(--ac-bg);color:var(--ac2)}

/* stat cards */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--r);
  padding:12px 13px;position:relative;overflow:hidden}
.stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--ac)}
.stat.ok::before{background:var(--ok)} .stat.warn::before{background:var(--warn)}
.stat.mute::before{background:var(--border2)}
.stat-l{font-size:9px;font-weight:800;letter-spacing:.08em;color:var(--sub);text-transform:uppercase}
.stat-v{font-size:22px;font-weight:900;letter-spacing:-.02em;margin-top:3px;font-variant-numeric:tabular-nums}
.stat-s{font-size:10px;color:var(--sub);margin-top:2px}

/* list rows */
.item{display:flex;align-items:center;gap:11px;background:var(--card);
  border:1px solid var(--border);border-radius:var(--r);padding:12px 13px;
  margin-bottom:8px;cursor:pointer;transition:transform .12s,border-color .15s}
.item:active{transform:scale(.99);border-color:var(--ac)}
.av{width:38px;height:38px;border-radius:50%;background:var(--ac-bg);color:var(--ac2);
  display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;flex-shrink:0}
.av.dog{background:var(--ok-bg);color:var(--ok);font-size:18px}
.item-b{flex:1;min-width:0}
.item-t{font-size:14px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-s{font-size:11px;color:var(--sub);margin-top:1px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.item-r{text-align:right;flex-shrink:0}
.item-amt{font-size:14px;font-weight:900;font-variant-numeric:tabular-nums}
.item-sub{font-size:10px;color:var(--sub);margin-top:1px}

/* sheet / modal */
.sheet-bg{position:fixed;inset:0;z-index:200;background:rgba(15,17,21,.45);
  display:flex;align-items:flex-end;animation:fade .2s ease}
.sheet-bg.hidden{display:none !important}
.sheet{width:100%;max-height:92dvh;background:var(--bg);border-radius:18px 18px 0 0;
  display:flex;flex-direction:column;animation:up .28s cubic-bezier(.25,.9,.3,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px;border-bottom:1px solid var(--border);flex-shrink:0}
.sheet-t{font-size:16px;font-weight:900}
.x{background:none;border:none;color:var(--sub);font-size:26px;line-height:1;
  cursor:pointer;padding:0 4px}
.sheet-b{padding:14px 16px calc(20px + env(safe-area-inset-bottom));overflow-y:auto}

/* segmented control */
.seg{display:flex;gap:5px;flex-wrap:wrap}
.seg button{flex:1;min-width:72px;background:var(--card);border:1px solid var(--border2);
  border-radius:9px;color:var(--sub);font-size:12px;font-weight:700;padding:9px 6px;
  cursor:pointer;transition:all .15s}
.seg button.on{background:var(--ac-bg);border-color:var(--ac);color:var(--ac2)}

/* calendar */
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-m{font-size:15px;font-weight:900}
.cal-nav{display:flex;gap:6px}
.cal-btn{width:32px;height:32px;border-radius:9px;background:var(--card);
  border:1px solid var(--border2);color:var(--sub);font-size:16px;cursor:pointer}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-dow{font-size:9px;font-weight:800;color:var(--sub);text-align:center;padding:4px 0}
.cal-d{aspect-ratio:1;border-radius:9px;background:var(--card);border:1px solid var(--border);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;cursor:pointer;position:relative;transition:all .15s}
.cal-d.other{opacity:.32}
.cal-d.today{border-color:var(--ac);color:var(--ac2);font-weight:900}
.cal-d.has{background:var(--ac-bg);border-color:var(--ac-bd)}
.cal-d .dot{width:5px;height:5px;border-radius:50%;background:var(--ac);margin-top:2px}
.cal-d.sel{background:var(--ac);color:#fff;border-color:var(--ac)}
.cal-d.sel .dot{background:#fff}

/* money bars */
.bar-row{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.bar-lbl{font-size:11px;font-weight:700;color:var(--sub);width:34px;flex-shrink:0}
.bar-tr{display:block;flex:1;height:8px;background:var(--bg2);border-radius:99px;overflow:hidden}
.bar-fl{display:block;height:100%;min-width:0;background:var(--ac);border-radius:99px;transition:width .5s cubic-bezier(.3,.8,.4,1)}
.bar-amt{font-size:11px;font-weight:800;width:62px;text-align:right;
  flex-shrink:0;font-variant-numeric:tabular-nums}

/* money breakdown */
.brk{display:flex;justify-content:space-between;padding:9px 0;
  border-bottom:1px solid var(--border);font-size:13px}
.brk:last-child{border-bottom:none}
.brk-l{color:var(--sub)}
.brk-v{font-weight:800;font-variant-numeric:tabular-nums}
.brk.total{border-top:2px solid var(--border);margin-top:4px;padding-top:11px;border-bottom:none}
.brk.total .brk-l{color:var(--text);font-weight:800}
.brk.total .brk-v{font-size:17px;color:var(--ok)}
.neg{color:var(--bad)}

/* fab */
.fab{position:fixed;right:16px;bottom:calc(80px + env(safe-area-inset-bottom));z-index:55;
  width:54px;height:54px;border-radius:50%;background:var(--ac);color:#fff;border:none;
  font-size:27px;line-height:1;cursor:pointer;box-shadow:0 6px 20px rgba(124,92,255,.38);
  transition:transform .15s}
.fab:active{transform:scale(.92)}

/* dog chips */
.dogchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.dogchip{background:var(--card);border:1px solid var(--border2);border-radius:99px;
  padding:6px 12px;font-size:12px;font-weight:700;color:var(--sub);cursor:pointer;transition:all .15s}
.dogchip.on{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}

/* detail rows */
.drow{display:flex;justify-content:space-between;gap:12px;padding:10px 0;
  border-bottom:1px solid var(--border);font-size:13px}
.drow:last-child{border-bottom:none}
.drow-l{color:var(--sub);flex-shrink:0}
.drow-v{font-weight:700;text-align:right;word-break:break-word}
.note{font-size:12px;color:var(--sub);line-height:1.6;white-space:pre-wrap}
.toast{position:fixed;left:50%;bottom:calc(94px + env(safe-area-inset-bottom));
  transform:translateX(-50%) scale(.9);z-index:300;background:var(--card);
  border:1px solid var(--border2);border-radius:99px;padding:10px 18px;font-size:13px;
  font-weight:700;opacity:0;pointer-events:none;transition:all .25s;
  box-shadow:0 6px 22px rgba(0,0,0,.12);white-space:nowrap;max-width:88vw;
  overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1;transform:translateX(-50%) scale(1)}
.inv{background:var(--card);border:1px solid var(--border);border-radius:var(--r);
  padding:16px;font-size:13px;line-height:1.7;white-space:pre-wrap;font-variant-numeric:tabular-nums}
</style>
</head>
<body>

<div class="hdr"><div class="hdr-in">
  <div><div class="logo">Pack<span>.</span></div>
    <div class="hdr-sub" id="hdr-sub">Dog sitting</div></div>
  <div style="text-align:right"><div style="font-size:17px;font-weight:900" id="hdr-amt">$0</div>
    <div class="hdr-sub">this month</div></div>
</div></div>

<!-- HOME -->
<section class="page on" id="p-home">
  <div class="stats" id="home-stats"></div>
  <div class="sh">Happening now</div>
  <div id="home-active"></div>
  <div class="sh">Coming up</div>
  <div id="home-upcoming"></div>
  <div class="sh">Needs invoicing</div>
  <div id="home-unpaid"></div>
</section>

<!-- CLIENTS -->
<section class="page" id="p-clients">
  <input class="in" id="cl-search" placeholder="Search clients or dogs" style="margin-bottom:12px"/>
  <div id="clients-list"></div>
</section>

<!-- CALENDAR -->
<section class="page" id="p-cal">
  <div class="card" style="margin-bottom:12px">
    <div class="cal-h">
      <div class="cal-m" id="cal-month"></div>
      <div class="cal-nav">
        <button class="cal-btn" id="cal-prev">&lsaquo;</button>
        <button class="cal-btn" id="cal-today">•</button>
        <button class="cal-btn" id="cal-next">&rsaquo;</button>
      </div>
    </div>
    <div class="cal-grid" id="cal-dows"></div>
    <div class="cal-grid" id="cal-grid" style="margin-top:4px"></div>
  </div>
  <div class="sh" id="cal-day-lbl">Bookings</div>
  <div id="cal-day-list"></div>
</section>

<!-- MONEY -->
<section class="page" id="p-money">
  <div class="seg" id="money-range" style="margin-bottom:12px">
    <button class="on" data-range="month">This month</button>
    <button data-range="year">This year</button>
    <button data-range="all">All time</button>
  </div>
  <div class="card" style="margin-bottom:12px">
    <div class="brk"><span class="brk-l">Rover bookings</span><span class="brk-v" id="m-rover">$0</span></div>
    <div class="brk"><span class="brk-l">Rover fee (<span id="m-cutpct">20</span>%)</span><span class="brk-v neg" id="m-fee">$0</span></div>
    <div class="brk"><span class="brk-l">Direct bookings</span><span class="brk-v" id="m-direct">$0</span></div>
    <div class="brk"><span class="brk-l">Tips</span><span class="brk-v" id="m-tips">$0</span></div>
    <div class="brk"><span class="brk-l">Expenses</span><span class="brk-v neg" id="m-exp">$0</span></div>
    <div class="brk"><span class="brk-l">Mileage <span id="m-miles-n" style="opacity:.7"></span></span><span class="brk-v neg" id="m-miles">$0</span></div>
    <div class="brk total"><span class="brk-l">Take-home</span><span class="brk-v" id="m-net">$0</span></div>
  </div>
  <div class="sh">By month</div>
  <div class="card" id="m-bars"></div>
  <div class="sh">Top clients</div>
  <div id="m-top"></div>
  <div class="sh">Expenses &amp; mileage</div>
  <button class="btn ghost sm" id="add-exp-btn" style="margin-bottom:10px">Add expense</button>
  <button class="btn ghost sm" id="add-trip-btn" style="margin-bottom:10px">Log mileage</button>
  <div id="exp-list"></div>
</section>

<!-- SETTINGS -->
<section class="page" id="p-set">
  <div class="sh">Default rates</div>
  <div class="card">
    <div class="row2">
      <div><label class="lbl">Boarding / night</label><input class="in" type="number" id="r-board"/></div>
      <div><label class="lbl">House sit / night</label><input class="in" type="number" id="r-house"/></div>
    </div>
    <div class="row2" style="margin-top:10px">
      <div><label class="lbl">Drop-in / visit</label><input class="in" type="number" id="r-drop"/></div>
      <div><label class="lbl">Walk / walk</label><input class="in" type="number" id="r-walk"/></div>
    </div>
    <div class="row2" style="margin-top:10px">
      <div><label class="lbl">Daycare / day</label><input class="in" type="number" id="r-day"/></div>
      <div><label class="lbl">Rover cut %</label><input class="in" type="number" id="r-cut"/></div>
    </div>
    <label class="lbl">Mileage rate ($/mile)</label>
    <input class="in" type="number" step="0.01" id="r-mile"/>
    <button class="btn" id="save-set" style="margin-top:14px">Save</button>
  </div>
  <div class="sh">Your details (for invoices)</div>
  <div class="card">
    <label class="lbl">Your name / business</label><input class="in" id="s-biz"/>
    <label class="lbl">Phone or email</label><input class="in" id="s-contact"/>
    <label class="lbl">Payment note</label>
    <input class="in" id="s-pay" placeholder="Venmo @handle · Cash · Zelle"/>
    <button class="btn" id="save-biz" style="margin-top:14px">Save</button>
  </div>
  <div class="sh">Data</div>
  <div class="card">
    <div style="font-size:12px;color:var(--sub);line-height:1.6;margin-bottom:11px" id="db-info"></div>
    <button class="btn" id="exp-btn">Download backup</button>
    <button class="btn ghost" id="imp-btn" style="margin-top:8px">Restore backup</button>
    <input type="file" id="imp-file" accept="application/json,.json" style="display:none"/>
    <button class="btn danger" id="wipe-btn" style="margin-top:8px">Erase everything</button>
  </div>
  <div style="text-align:center;font-size:11px;color:var(--sub);margin-top:16px">Pack · build <b id="build-tag"></b></div>
</section>

<button class="fab" id="fab">+</button>

<nav class="tabs">
  <button class="tab on" data-tab="home"><span class="ico">🏠</span>Home</button>
  <button class="tab" data-tab="clients"><span class="ico">🐕</span>Clients</button>
  <button class="tab" data-tab="cal"><span class="ico">📅</span>Calendar</button>
  <button class="tab" data-tab="money"><span class="ico">💵</span>Money</button>
  <button class="tab" data-tab="set"><span class="ico">⚙️</span>Settings</button>
</nav>

<div class="sheet-bg hidden" id="sheet"><div class="sheet">
  <div class="sheet-h"><div class="sheet-t" id="sheet-t"></div><button class="x" id="sheet-x">×</button></div>
  <div class="sheet-b" id="sheet-b"></div>
</div></div>

<div class="toast" id="toast"></div>
<script>
const BUILD="2026.08.20";
const DB_KEY="pack.db", DB_V=1;
let DB=null, suppressFlush=false;

function blank(){return{__v:DB_V,__u:Date.now(),data:{}}}
function dbLoad(){
  try{const r=localStorage.getItem(DB_KEY);
    if(r){const p=JSON.parse(r); if(p&&p.data){DB=p;DB.__v=DB_V;return;}}
  }catch(e){console.warn("db parse failed",e)}
  DB=blank(); dbFlush();
}
function dbFlush(){
  if(suppressFlush||!DB)return;
  DB.__u=Date.now();
  try{localStorage.setItem(DB_KEY,JSON.stringify(DB))}
  catch(e){console.error("save failed",e);toast("Save failed — storage full?")}
}
const get=(k,d)=>{if(!DB)dbLoad();const v=DB.data[k];return v===undefined?d:v};
const set=(k,v)=>{if(!DB)dbLoad();DB.data[k]=v;dbFlush()};
addEventListener("pagehide",dbFlush);
addEventListener("beforeunload",dbFlush);
document.addEventListener("visibilitychange",()=>{if(document.hidden)dbFlush()});

// ── state ──────────────────────────────────────────────────────────────
let clients=[], dogs=[], bookings=[], expenses=[], trips=[], settings={}, biz={};
const DEF_SET={board:60,house:75,drop:25,walk:22,day:45,cut:20,mile:0.70};

function loadAll(){
  dbLoad();
  clients=get("clients",[]); dogs=get("dogs",[]); bookings=get("bookings",[]);
  expenses=get("expenses",[]); trips=get("trips",[]);
  settings={...DEF_SET,...get("settings",{})};
  biz=get("biz",{name:"",contact:"",pay:""});
}

// ── helpers ────────────────────────────────────────────────────────────
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>new Date().toISOString().split("T")[0];
const money=n=>"$"+(Math.round((+n||0)*100)/100).toLocaleString("en-US",{minimumFractionDigits:(Math.abs(n)%1?2:0),maximumFractionDigits:2});
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function dnum(d){const x=new Date(d+"T00:00:00");return isNaN(x)?null:x}
function fmtD(d){const x=dnum(d);if(!x)return d;
  return x.toLocaleDateString("en-US",{month:"short",day:"numeric"})}
function fmtDL(d){const x=dnum(d);if(!x)return d;
  return x.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"})}
function daysBetween(a,b){const x=dnum(a),y=dnum(b);if(!x||!y)return 0;
  return Math.max(0,Math.round((y-x)/864e5))}
function toast(m){const t=document.getElementById("toast");t.textContent=m;
  t.classList.add("on");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("on"),2100)}

const SERVICES={
  board:{n:"Boarding",unit:"night",rate:"board"},
  house:{n:"House sitting",unit:"night",rate:"house"},
  drop:{n:"Drop-in visit",unit:"visit",rate:"drop"},
  walk:{n:"Dog walk",unit:"walk",rate:"walk"},
  day:{n:"Daycare",unit:"day",rate:"day"},
};

// money maths for one booking
function calc(b){
  const gross=(+b.units||0)*(+b.rate||0);
  const fee=b.platform==="rover" ? gross*((+settings.cut||0)/100) : 0;
  const tip=+b.tip||0;
  return {gross, fee, tip, net:gross-fee+tip};
}
function clientOf(id){return clients.find(c=>c.id===id)}
function dogsOf(id){return dogs.filter(d=>d.clientId===id)}
function dogNames(ids){
  if(!ids||!ids.length)return "";
  return ids.map(i=>{const d=dogs.find(x=>x.id===i);return d?d.name:""}).filter(Boolean).join(", ");
}
function statusOf(b){
  if(b.cancelled)return "cancelled";
  const t=today();
  if(b.end<t)return "done";
  if(b.start<=t&&b.end>=t)return "active";
  return "upcoming";
}

// ── sheet ──────────────────────────────────────────────────────────────
function openSheet(title,html){
  document.getElementById("sheet-t").textContent=title;
  document.getElementById("sheet-b").innerHTML=html;
  document.getElementById("sheet").classList.remove("hidden");
}
function closeSheet(){document.getElementById("sheet").classList.add("hidden")}
document.getElementById("sheet-x").addEventListener("click",closeSheet);
document.getElementById("sheet").addEventListener("click",e=>{
  if(e.target===document.getElementById("sheet"))closeSheet()});

// ── tabs ───────────────────────────────────────────────────────────────
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));
  document.querySelectorAll(".page").forEach(x=>x.classList.remove("on"));
  b.classList.add("on");
  document.getElementById("p-"+b.dataset.tab).classList.add("on");
  scrollTo(0,0);
  const t=b.dataset.tab;
  if(t==="home")renderHome();
  if(t==="clients")renderClients();
  if(t==="cal")renderCal();
  if(t==="money")renderMoney();
  if(t==="set")renderSet();
  document.getElementById("fab").style.display = t==="money"||t==="set" ? "none":"";
}));

// ── HOME ───────────────────────────────────────────────────────────────
function monthRange(){
  const n=new Date(), s=new Date(n.getFullYear(),n.getMonth(),1),
        e=new Date(n.getFullYear(),n.getMonth()+1,0);
  return [s.toISOString().split("T")[0], e.toISOString().split("T")[0]];
}
function bookingsIn(a,b){
  return bookings.filter(x=>!x.cancelled && x.end>=a && x.start<=b);
}
function renderHome(){
  const [ms,me]=monthRange();
  const mb=bookingsIn(ms,me);
  const net=mb.reduce((s,b)=>s+calc(b).net,0);
  document.getElementById("hdr-amt").textContent=money(net);

  const t=today();
  const active=bookings.filter(b=>!b.cancelled&&b.start<=t&&b.end>=t);
  const upcoming=bookings.filter(b=>!b.cancelled&&b.start>t).sort((a,b)=>a.start.localeCompare(b.start));
  const unpaid=bookings.filter(b=>!b.cancelled&&b.platform==="direct"&&!b.paid&&b.end<=t);
  const dogsToday=active.reduce((s,b)=>s+(b.dogIds?b.dogIds.length:0),0);

  document.getElementById("home-stats").innerHTML=
    stat("This month",money(net),mb.length+" booking"+(mb.length===1?"":"s"),"")+
    stat("Dogs today",String(dogsToday),active.length+" stay"+(active.length===1?"":"s"),"ok")+
    stat("Upcoming",String(upcoming.length),upcoming[0]?"next "+fmtD(upcoming[0].start):"nothing booked","mute")+
    stat("Unpaid",money(unpaid.reduce((s,b)=>s+calc(b).net,0)),unpaid.length+" to invoice",unpaid.length?"warn":"mute");

  document.getElementById("home-active").innerHTML =
    active.length ? active.map(bookingRow).join("")
    : '<div class="empty">No dogs staying today.</div>';
  document.getElementById("home-upcoming").innerHTML =
    upcoming.length ? upcoming.slice(0,5).map(bookingRow).join("")
    : '<div class="empty">Nothing booked yet. Tap + to add one.</div>';
  document.getElementById("home-unpaid").innerHTML =
    unpaid.length ? unpaid.map(bookingRow).join("")
    : '<div class="empty">Everything invoiced.</div>';
  wireRows();
}
function stat(l,v,s,cls){
  return '<div class="stat '+cls+'"><div class="stat-l">'+l+'</div>'+
    '<div class="stat-v">'+v+'</div><div class="stat-s">'+s+'</div></div>';
}
function bookingRow(b){
  const c=clientOf(b.clientId), st=statusOf(b), sv=SERVICES[b.service]||{n:b.service,unit:""};
  const dn=dogNames(b.dogIds);
  const rng=b.start===b.end?fmtD(b.start):fmtD(b.start)+" – "+fmtD(b.end);
  return '<div class="item" data-book="'+b.id+'">'+
    '<div class="av dog">🐾</div><div class="item-b">'+
    '<div class="item-t">'+esc(c?c.name:"Unknown")+(dn?' · '+esc(dn):'')+'</div>'+
    '<div class="item-s">'+sv.n+' · '+rng+' · '+b.units+' '+sv.unit+(b.units===1?"":"s")+'</div>'+
    '</div><div class="item-r"><div class="item-amt">'+money(calc(b).net)+'</div>'+
    '<div class="item-sub"><span class="pill '+st+'">'+st+'</span></div></div></div>';
}
function wireRows(){
  document.querySelectorAll("[data-book]").forEach(el=>{
    el.addEventListener("click",()=>showBooking(el.dataset.book))});
  document.querySelectorAll("[data-client]").forEach(el=>{
    el.addEventListener("click",()=>showClient(el.dataset.client))});
}

// ── CLIENTS ────────────────────────────────────────────────────────────
function renderClients(){
  const q=(document.getElementById("cl-search").value||"").toLowerCase().trim();
  let list=clients.slice().sort((a,b)=>a.name.localeCompare(b.name));
  if(q) list=list.filter(c=>
    c.name.toLowerCase().includes(q) ||
    dogsOf(c.id).some(d=>d.name.toLowerCase().includes(q)));
  const host=document.getElementById("clients-list");
  if(!list.length){
    host.innerHTML='<div class="empty">'+(q?"No matches.":"No clients yet. Tap + to add one.")+'</div>';
    return;
  }
  host.innerHTML=list.map(c=>{
    const ds=dogsOf(c.id), bs=bookings.filter(b=>b.clientId===c.id&&!b.cancelled);
    const earned=bs.reduce((s,b)=>s+calc(b).net,0);
    return '<div class="item" data-client="'+c.id+'">'+
      '<div class="av">'+esc((c.name||"?").charAt(0).toUpperCase())+'</div>'+
      '<div class="item-b"><div class="item-t">'+esc(c.name)+'</div>'+
      '<div class="item-s">'+(ds.length?esc(ds.map(d=>d.name).join(", ")):"no dogs added")+
      ' · '+bs.length+' booking'+(bs.length===1?"":"s")+'</div></div>'+
      '<div class="item-r"><div class="item-amt">'+money(earned)+'</div>'+
      '<div class="item-sub">lifetime</div></div></div>';
  }).join("");
  wireRows();
}
document.getElementById("cl-search").addEventListener("input",renderClients);

function clientForm(c){
  c=c||{};
  return '<label class="lbl">Name</label><input class="in" id="f-name" value="'+esc(c.name||"")+'"/>'+
    '<label class="lbl">Phone</label><input class="in" id="f-phone" type="tel" value="'+esc(c.phone||"")+'"/>'+
    '<label class="lbl">Email</label><input class="in" id="f-email" type="email" value="'+esc(c.email||"")+'"/>'+
    '<label class="lbl">Address</label><input class="in" id="f-addr" value="'+esc(c.address||"")+'"/>'+
    '<label class="lbl">Notes</label><textarea class="in" id="f-notes">'+esc(c.notes||"")+'</textarea>'+
    '<div class="err" id="f-err"></div>'+
    '<button class="btn" id="f-save">'+(c.id?"Save changes":"Add client")+'</button>'+
    (c.id?'<button class="btn danger" id="f-del" style="margin-top:8px">Delete client</button>':'');
}
function addClient(existing){
  openSheet(existing?"Edit client":"New client", clientForm(existing));
  document.getElementById("f-save").addEventListener("click",()=>{
    const name=document.getElementById("f-name").value.trim();
    if(!name){document.getElementById("f-err").textContent="Name is required.";return}
    const rec={
      id:existing?existing.id:uid("c"), name,
      phone:document.getElementById("f-phone").value.trim(),
      email:document.getElementById("f-email").value.trim(),
      address:document.getElementById("f-addr").value.trim(),
      notes:document.getElementById("f-notes").value.trim(),
      created:existing?existing.created:today()
    };
    if(existing) clients=clients.map(c=>c.id===rec.id?rec:c);
    else clients.push(rec);
    set("clients",clients); closeSheet(); renderClients(); renderHome();
    toast(existing?"Client updated":name+" added");
  });
  const del=document.getElementById("f-del");
  if(del) del.addEventListener("click",()=>{
    const n=bookings.filter(b=>b.clientId===existing.id).length;
    if(!confirm("Delete "+existing.name+"?"+(n?" This also removes "+n+" booking"+(n===1?"":"s")+" and their dogs.":" This also removes their dogs.")))return;
    clients=clients.filter(c=>c.id!==existing.id);
    dogs=dogs.filter(d=>d.clientId!==existing.id);
    bookings=bookings.filter(b=>b.clientId!==existing.id);
    set("clients",clients);set("dogs",dogs);set("bookings",bookings);
    closeSheet(); renderClients(); renderHome(); toast("Deleted");
  });
}

function showClient(id){
  const c=clientOf(id); if(!c)return;
  const ds=dogsOf(id);
  const bs=bookings.filter(b=>b.clientId===id&&!b.cancelled).sort((a,b)=>b.start.localeCompare(a.start));
  const earned=bs.reduce((s,b)=>s+calc(b).net,0);
  let h='<div class="card" style="margin-bottom:12px">';
  if(c.phone) h+='<div class="drow"><span class="drow-l">Phone</span><span class="drow-v"><a href="tel:'+esc(c.phone)+'" style="color:var(--ac)">'+esc(c.phone)+'</a></span></div>';
  if(c.email) h+='<div class="drow"><span class="drow-l">Email</span><span class="drow-v">'+esc(c.email)+'</span></div>';
  if(c.address) h+='<div class="drow"><span class="drow-l">Address</span><span class="drow-v">'+esc(c.address)+'</span></div>';
  h+='<div class="drow"><span class="drow-l">Bookings</span><span class="drow-v">'+bs.length+'</span></div>';
  h+='<div class="drow"><span class="drow-l">Lifetime</span><span class="drow-v">'+money(earned)+'</span></div>';
  h+='</div>';
  if(c.notes) h+='<div class="sh">Notes</div><div class="card"><div class="note">'+esc(c.notes)+'</div></div>';

  h+='<div class="sh">Dogs</div>';
  h+= ds.length ? ds.map(d=>
      '<div class="item" data-dog="'+d.id+'"><div class="av dog">🐶</div><div class="item-b">'+
      '<div class="item-t">'+esc(d.name)+'</div><div class="item-s">'+
      esc([d.breed,d.size,d.age].filter(Boolean).join(" · ")||"tap to add details")+'</div></div></div>').join("")
    : '<div class="empty">No dogs yet.</div>';
  h+='<button class="btn ghost sm" id="add-dog">Add a dog</button>';

  h+='<div class="sh">Booking history</div>';
  h+= bs.length ? bs.slice(0,10).map(bookingRow).join("") : '<div class="empty">No bookings yet.</div>';
  h+='<button class="btn" id="new-booking" style="margin-top:10px">New booking</button>';
  h+='<button class="btn ghost" id="edit-client" style="margin-top:8px">Edit client</button>';

  openSheet(c.name,h);
  document.getElementById("add-dog").addEventListener("click",()=>addDog(null,id));
  document.getElementById("new-booking").addEventListener("click",()=>addBooking(null,id));
  document.getElementById("edit-client").addEventListener("click",()=>addClient(c));
  document.querySelectorAll("[data-dog]").forEach(el=>
    el.addEventListener("click",()=>addDog(dogs.find(d=>d.id===el.dataset.dog))));
  wireRows();
}

// ── DOGS ───────────────────────────────────────────────────────────────
function addDog(d,clientId){
  d=d||{}; const cid=d.clientId||clientId;
  const h='<label class="lbl">Dog name</label><input class="in" id="d-name" value="'+esc(d.name||"")+'"/>'+
    '<div class="row2"><div><label class="lbl">Breed</label><input class="in" id="d-breed" value="'+esc(d.breed||"")+'"/></div>'+
    '<div><label class="lbl">Age</label><input class="in" id="d-age" value="'+esc(d.age||"")+'"/></div></div>'+
    '<label class="lbl">Size</label><div class="seg" id="d-size">'+
      ["Small","Medium","Large","XL"].map(s=>'<button data-size="'+s+'"'+(d.size===s?' class="on"':'')+'>'+s+'</button>').join("")+
    '</div>'+
    '<label class="lbl">Feeding</label><textarea class="in" id="d-feed">'+esc(d.feeding||"")+'</textarea>'+
    '<label class="lbl">Medications</label><textarea class="in" id="d-meds">'+esc(d.meds||"")+'</textarea>'+
    '<label class="lbl">Vet</label><input class="in" id="d-vet" value="'+esc(d.vet||"")+'"/>'+
    '<label class="lbl">Quirks &amp; notes</label><textarea class="in" id="d-notes">'+esc(d.notes||"")+'</textarea>'+
    '<div class="err" id="d-err"></div>'+
    '<button class="btn" id="d-save">'+(d.id?"Save":"Add dog")+'</button>'+
    (d.id?'<button class="btn danger" id="d-del" style="margin-top:8px">Delete dog</button>':'');
  openSheet(d.id?d.name:"New dog",h);
  let size=d.size||"Medium";
  document.querySelectorAll("#d-size button").forEach(b=>b.addEventListener("click",()=>{
    size=b.dataset.size;
    document.querySelectorAll("#d-size button").forEach(x=>x.classList.remove("on"));
    b.classList.add("on")}));
  if(!d.size){const m=document.querySelector('#d-size [data-size="Medium"]');if(m)m.classList.add("on")}
  document.getElementById("d-save").addEventListener("click",()=>{
    const name=document.getElementById("d-name").value.trim();
    if(!name){document.getElementById("d-err").textContent="Give the dog a name.";return}
    const rec={id:d.id||uid("d"),clientId:cid,name,size,
      breed:document.getElementById("d-breed").value.trim(),
      age:document.getElementById("d-age").value.trim(),
      feeding:document.getElementById("d-feed").value.trim(),
      meds:document.getElementById("d-meds").value.trim(),
      vet:document.getElementById("d-vet").value.trim(),
      notes:document.getElementById("d-notes").value.trim()};
    if(d.id) dogs=dogs.map(x=>x.id===rec.id?rec:x); else dogs.push(rec);
    set("dogs",dogs); showClient(cid); toast(d.id?"Saved":name+" added");
  });
  const del=document.getElementById("d-del");
  if(del) del.addEventListener("click",()=>{
    if(!confirm("Delete "+d.name+"?"))return;
    dogs=dogs.filter(x=>x.id!==d.id);
    bookings=bookings.map(b=>({...b,dogIds:(b.dogIds||[]).filter(i=>i!==d.id)}));
    set("dogs",dogs);set("bookings",bookings);showClient(cid);toast("Deleted");
  });
}

// ── BOOKINGS ───────────────────────────────────────────────────────────
function addBooking(b,clientId){
  b=b||{};
  const cid=b.clientId||clientId||"";
  if(!clients.length){
    openSheet("New booking",'<div class="empty">Add a client first — bookings belong to someone.</div>'+
      '<button class="btn" id="b-goclient">Add a client</button>');
    document.getElementById("b-goclient").addEventListener("click",()=>addClient());
    return;
  }
  const svc=b.service||"board";
  const h=
    '<label class="lbl">Client</label><select class="in" id="b-client">'+
      clients.slice().sort((a,c)=>a.name.localeCompare(c.name))
        .map(c=>'<option value="'+c.id+'"'+(c.id===cid?" selected":"")+'>'+esc(c.name)+'</option>').join("")+
    '</select>'+
    '<label class="lbl">Dogs</label><div class="dogchips" id="b-dogs"></div>'+
    '<label class="lbl">Service</label><div class="seg" id="b-svc">'+
      Object.keys(SERVICES).map(k=>'<button data-svc="'+k+'"'+(svc===k?' class="on"':'')+'>'+SERVICES[k].n+'</button>').join("")+
    '</div>'+
    '<div class="row2"><div><label class="lbl">Start</label><input class="in" type="date" id="b-start" value="'+(b.start||today())+'"/></div>'+
    '<div><label class="lbl">End</label><input class="in" type="date" id="b-end" value="'+(b.end||today())+'"/></div></div>'+
    '<div class="row2"><div><label class="lbl" id="b-units-l">Nights</label><input class="in" type="number" id="b-units" value="'+(b.units!=null?b.units:1)+'"/></div>'+
    '<div><label class="lbl">Rate each</label><input class="in" type="number" step="0.01" id="b-rate" value="'+(b.rate!=null?b.rate:settings.board)+'"/></div></div>'+
    '<label class="lbl">Booked through</label><div class="seg" id="b-plat">'+
      '<button data-plat="rover"'+((b.platform||"rover")==="rover"?' class="on"':'')+'>Rover</button>'+
      '<button data-plat="direct"'+(b.platform==="direct"?' class="on"':'')+'>Direct / cash</button></div>'+
    '<div class="row2"><div><label class="lbl">Tip</label><input class="in" type="number" step="0.01" id="b-tip" value="'+(b.tip||0)+'"/></div>'+
    '<div><label class="lbl">Paid?</label><div class="seg" id="b-paid">'+
      '<button data-paid="1"'+(b.paid?' class="on"':'')+'>Paid</button>'+
      '<button data-paid="0"'+(b.paid?'':' class="on"')+'>Not yet</button></div></div></div>'+
    '<label class="lbl">Notes</label><textarea class="in" id="b-notes">'+esc(b.notes||"")+'</textarea>'+
    '<div class="card" style="margin-top:14px"><div id="b-preview"></div></div>'+
    '<div class="err" id="b-err"></div>'+
    '<button class="btn" id="b-save">'+(b.id?"Save booking":"Add booking")+'</button>'+
    (b.id?'<button class="btn danger" id="b-del" style="margin-top:8px">Delete booking</button>':'');
  openSheet(b.id?"Edit booking":"New booking",h);

  let service=svc, platform=b.platform||"rover", paid=!!b.paid;
  let picked=(b.dogIds||[]).slice();

  function renderDogPicks(){
    const c=document.getElementById("b-client").value;
    const ds=dogsOf(c);
    picked=picked.filter(i=>ds.some(d=>d.id===i));
    if(!ds.length && !picked.length) picked=[];
    document.getElementById("b-dogs").innerHTML = ds.length
      ? ds.map(d=>'<div class="dogchip'+(picked.includes(d.id)?" on":"")+'" data-pick="'+d.id+'">'+esc(d.name)+'</div>').join("")
      : '<div style="font-size:12px;color:var(--sub)">No dogs saved for this client yet.</div>';
    document.querySelectorAll("[data-pick]").forEach(el=>el.addEventListener("click",()=>{
      const id=el.dataset.pick;
      picked=picked.includes(id)?picked.filter(x=>x!==id):picked.concat(id);
      renderDogPicks();
    }));
  }
  function autoUnits(){
    const s=document.getElementById("b-start").value, e=document.getElementById("b-end").value;
    const u=SERVICES[service].unit;
    document.getElementById("b-units-l").textContent=u.charAt(0).toUpperCase()+u.slice(1)+"s";
    if(u==="night"){
      const n=daysBetween(s,e);
      document.getElementById("b-units").value=Math.max(1,n);
    }
    preview();
  }
  function preview(){
    const tmp={units:+document.getElementById("b-units").value||0,
               rate:+document.getElementById("b-rate").value||0,
               tip:+document.getElementById("b-tip").value||0, platform};
    const c=calc(tmp);
    document.getElementById("b-preview").innerHTML=
      '<div class="brk"><span class="brk-l">Gross</span><span class="brk-v">'+money(c.gross)+'</span></div>'+
      (platform==="rover"?'<div class="brk"><span class="brk-l">Rover fee '+settings.cut+'%</span><span class="brk-v neg">−'+money(c.fee)+'</span></div>':'')+
      (c.tip?'<div class="brk"><span class="brk-l">Tip</span><span class="brk-v">'+money(c.tip)+'</span></div>':'')+
      '<div class="brk total"><span class="brk-l">You keep</span><span class="brk-v">'+money(c.net)+'</span></div>';
  }
  document.getElementById("b-client").addEventListener("change",renderDogPicks);
  document.querySelectorAll("#b-svc button").forEach(x=>x.addEventListener("click",()=>{
    service=x.dataset.svc;
    document.querySelectorAll("#b-svc button").forEach(y=>y.classList.remove("on"));
    x.classList.add("on");
    if(!b.id) document.getElementById("b-rate").value=settings[SERVICES[service].rate];
    autoUnits();
  }));
  document.querySelectorAll("#b-plat button").forEach(x=>x.addEventListener("click",()=>{
    platform=x.dataset.plat;
    document.querySelectorAll("#b-plat button").forEach(y=>y.classList.remove("on"));
    x.classList.add("on"); preview();
  }));
  document.querySelectorAll("#b-paid button").forEach(x=>x.addEventListener("click",()=>{
    paid=x.dataset.paid==="1";
    document.querySelectorAll("#b-paid button").forEach(y=>y.classList.remove("on"));
    x.classList.add("on");
  }));
  ["b-start","b-end"].forEach(i=>document.getElementById(i).addEventListener("change",autoUnits));
  ["b-units","b-rate","b-tip"].forEach(i=>document.getElementById(i).addEventListener("input",preview));
  renderDogPicks(); autoUnits();

  document.getElementById("b-save").addEventListener("click",()=>{
    const err=document.getElementById("b-err"); err.textContent="";
    const start=document.getElementById("b-start").value, end=document.getElementById("b-end").value;
    const units=+document.getElementById("b-units").value, rate=+document.getElementById("b-rate").value;
    if(!start||!end){err.textContent="Pick both dates.";return}
    if(end<start){err.textContent="End date is before the start date.";return}
    if(!(units>0)){err.textContent="Units must be at least 1.";return}
    if(!(rate>=0)){err.textContent="Rate can't be negative.";return}
    const rec={id:b.id||uid("b"),clientId:document.getElementById("b-client").value,
      dogIds:picked,service,start,end,units,rate,platform,paid,
      tip:+document.getElementById("b-tip").value||0,
      notes:document.getElementById("b-notes").value.trim(),
      created:b.created||today(),cancelled:!!b.cancelled};
    if(b.id) bookings=bookings.map(x=>x.id===rec.id?rec:x); else bookings.push(rec);
    set("bookings",bookings); closeSheet();
    renderHome(); renderClients(); renderCal(); renderMoney();
    toast(b.id?"Booking saved":"Booking added");
  });
  const del=document.getElementById("b-del");
  if(del) del.addEventListener("click",()=>{
    if(!confirm("Delete this booking?"))return;
    bookings=bookings.filter(x=>x.id!==b.id); set("bookings",bookings);
    closeSheet(); renderHome(); renderCal(); renderMoney(); toast("Deleted");
  });
}

function showBooking(id){
  const b=bookings.find(x=>x.id===id); if(!b)return;
  const c=clientOf(b.clientId), sv=SERVICES[b.service]||{n:b.service,unit:""}, m=calc(b);
  const st=statusOf(b);
  let h='<div class="card" style="margin-bottom:12px">'+
    '<div class="drow"><span class="drow-l">Client</span><span class="drow-v">'+esc(c?c.name:"—")+'</span></div>'+
    (b.dogIds&&b.dogIds.length?'<div class="drow"><span class="drow-l">Dogs</span><span class="drow-v">'+esc(dogNames(b.dogIds))+'</span></div>':'')+
    '<div class="drow"><span class="drow-l">Service</span><span class="drow-v">'+sv.n+'</span></div>'+
    '<div class="drow"><span class="drow-l">Dates</span><span class="drow-v">'+fmtDL(b.start)+(b.start!==b.end?' → '+fmtDL(b.end):'')+'</span></div>'+
    '<div class="drow"><span class="drow-l">Status</span><span class="drow-v"><span class="pill '+st+'">'+st+'</span> '+
      '<span class="pill '+(b.paid?"paid":"unpaid")+'">'+(b.paid?"paid":"unpaid")+'</span></span></div>'+
    '</div>';
  h+='<div class="card" style="margin-bottom:12px">'+
    '<div class="brk"><span class="brk-l">'+b.units+' '+sv.unit+(b.units===1?"":"s")+' × '+money(b.rate)+'</span><span class="brk-v">'+money(m.gross)+'</span></div>'+
    (b.platform==="rover"?'<div class="brk"><span class="brk-l">Rover fee '+settings.cut+'%</span><span class="brk-v neg">−'+money(m.fee)+'</span></div>':
      '<div class="brk"><span class="brk-l">Direct booking</span><span class="brk-v">no fee</span></div>')+
    (m.tip?'<div class="brk"><span class="brk-l">Tip</span><span class="brk-v">'+money(m.tip)+'</span></div>':'')+
    '<div class="brk total"><span class="brk-l">You keep</span><span class="brk-v">'+money(m.net)+'</span></div></div>';
  if(b.notes) h+='<div class="sh">Notes</div><div class="card"><div class="note">'+esc(b.notes)+'</div></div>';
  h+='<button class="btn" id="bk-edit" style="margin-top:12px">Edit booking</button>';
  if(b.platform==="direct") h+='<button class="btn ghost" id="bk-inv" style="margin-top:8px">Make invoice</button>';
  h+='<button class="btn ghost" id="bk-paid" style="margin-top:8px">'+(b.paid?"Mark unpaid":"Mark as paid")+'</button>';
  openSheet(sv.n,h);
  document.getElementById("bk-edit").addEventListener("click",()=>addBooking(b));
  document.getElementById("bk-paid").addEventListener("click",()=>{
    b.paid=!b.paid; bookings=bookings.map(x=>x.id===b.id?b:x); set("bookings",bookings);
    closeSheet(); renderHome(); renderMoney(); toast(b.paid?"Marked paid":"Marked unpaid");
  });
  const inv=document.getElementById("bk-inv");
  if(inv) inv.addEventListener("click",()=>makeInvoice(b));
}

// ── INVOICE ────────────────────────────────────────────────────────────
function makeInvoice(b){
  const c=clientOf(b.clientId), sv=SERVICES[b.service], m=calc(b);
  const lines=[];
  lines.push((biz.name||"Dog Sitting")+" — Invoice");
  lines.push("Date: "+fmtDL(today()));
  lines.push("");
  lines.push("For: "+(c?c.name:"—"));
  if(b.dogIds&&b.dogIds.length) lines.push("Dogs: "+dogNames(b.dogIds));
  lines.push("");
  lines.push(sv.n);
  lines.push(fmtDL(b.start)+(b.start!==b.end?"  →  "+fmtDL(b.end):""));
  lines.push(b.units+" "+sv.unit+(b.units===1?"":"s")+" × "+money(b.rate)+"  =  "+money(m.gross));
  if(m.tip) lines.push("Tip: "+money(m.tip));
  lines.push("");
  lines.push("TOTAL DUE: "+money(m.gross+m.tip));
  lines.push("");
  if(biz.pay) lines.push("Payment: "+biz.pay);
  if(biz.contact) lines.push("Questions: "+biz.contact);
  lines.push("");
  lines.push("Thank you!");
  const txt=lines.join("\n");
  openSheet("Invoice",
    '<div class="inv" id="inv-txt">'+esc(txt)+'</div>'+
    '<button class="btn" id="inv-copy" style="margin-top:12px">Copy invoice</button>'+
    '<button class="btn ghost" id="inv-share" style="margin-top:8px">Share</button>'+
    '<button class="btn ghost" id="inv-paid" style="margin-top:8px">Mark as paid</button>');
  document.getElementById("inv-copy").addEventListener("click",async()=>{
    try{
      if(navigator.clipboard&&navigator.clipboard.writeText) await navigator.clipboard.writeText(txt);
      else{const t=document.createElement("textarea");t.value=txt;document.body.appendChild(t);
        t.select();document.execCommand("copy");t.remove()}
      toast("Invoice copied");
    }catch(e){toast("Couldn't copy — select the text instead")}
  });
  document.getElementById("inv-share").addEventListener("click",async()=>{
    if(navigator.share){try{await navigator.share({title:"Invoice",text:txt})}catch(e){}}
    else toast("Sharing isn't supported here — use Copy");
  });
  document.getElementById("inv-paid").addEventListener("click",()=>{
    b.paid=true; bookings=bookings.map(x=>x.id===b.id?b:x); set("bookings",bookings);
    closeSheet(); renderHome(); renderMoney(); toast("Marked paid");
  });
}

// ── CALENDAR ───────────────────────────────────────────────────────────
let calY=new Date().getFullYear(), calM=new Date().getMonth(), calSel=today();
function renderCal(){
  document.getElementById("cal-dows").innerHTML=
    ["S","M","T","W","T","F","S"].map(d=>'<div class="cal-dow">'+d+'</div>').join("");
  const first=new Date(calY,calM,1), start=new Date(first);
  start.setDate(1-first.getDay());
  document.getElementById("cal-month").textContent=
    first.toLocaleDateString("en-US",{month:"long",year:"numeric"});
  let html="";
  for(let i=0;i<42;i++){
    const d=new Date(start); d.setDate(start.getDate()+i);
    const iso=d.toISOString().split("T")[0];
    const other=d.getMonth()!==calM;
    const has=bookings.some(b=>!b.cancelled&&b.start<=iso&&b.end>=iso);
    const cls=["cal-d",other?"other":"",iso===today()?"today":"",has?"has":"",iso===calSel?"sel":""]
      .filter(Boolean).join(" ");
    html+='<div class="'+cls+'" data-day="'+iso+'">'+d.getDate()+(has?'<span class="dot"></span>':'')+'</div>';
  }
  document.getElementById("cal-grid").innerHTML=html;
  document.querySelectorAll("[data-day]").forEach(el=>el.addEventListener("click",()=>{
    calSel=el.dataset.day; renderCal();
  }));
  const list=bookings.filter(b=>!b.cancelled&&b.start<=calSel&&b.end>=calSel);
  document.getElementById("cal-day-lbl").textContent=fmtDL(calSel);
  document.getElementById("cal-day-list").innerHTML=
    list.length?list.map(bookingRow).join("")
    :'<div class="empty">Nothing booked. Tap + to add.</div>';
  wireRows();
}
document.getElementById("cal-prev").addEventListener("click",()=>{
  calM--; if(calM<0){calM=11;calY--} renderCal()});
document.getElementById("cal-next").addEventListener("click",()=>{
  calM++; if(calM>11){calM=0;calY++} renderCal()});
document.getElementById("cal-today").addEventListener("click",()=>{
  const n=new Date(); calY=n.getFullYear(); calM=n.getMonth(); calSel=today(); renderCal()});

// ── MONEY ──────────────────────────────────────────────────────────────
let moneyRange="month";
document.querySelectorAll("#money-range button").forEach(b=>b.addEventListener("click",()=>{
  moneyRange=b.dataset.range;
  document.querySelectorAll("#money-range button").forEach(x=>x.classList.remove("on"));
  b.classList.add("on"); renderMoney();
}));
function rangeBounds(){
  const n=new Date();
  if(moneyRange==="month"){
    return [new Date(n.getFullYear(),n.getMonth(),1).toISOString().split("T")[0],
            new Date(n.getFullYear(),n.getMonth()+1,0).toISOString().split("T")[0]];
  }
  if(moneyRange==="year") return [n.getFullYear()+"-01-01", n.getFullYear()+"-12-31"];
  return ["0000-01-01","9999-12-31"];
}
function renderMoney(){
  const [a,z]=rangeBounds();
  const bs=bookings.filter(b=>!b.cancelled&&b.end>=a&&b.start<=z);
  const ex=expenses.filter(e=>e.date>=a&&e.date<=z);
  const tr=trips.filter(t=>t.date>=a&&t.date<=z);

  let rover=0,fee=0,direct=0,tips=0;
  bs.forEach(b=>{const m=calc(b); tips+=m.tip;
    if(b.platform==="rover"){rover+=m.gross;fee+=m.fee} else direct+=m.gross});
  const expTotal=ex.reduce((s,e)=>s+(+e.amount||0),0);
  const miles=tr.reduce((s,t)=>s+(+t.miles||0),0);
  const mileAmt=miles*(+settings.mile||0);
  const net=rover-fee+direct+tips-expTotal-mileAmt;

  document.getElementById("m-cutpct").textContent=settings.cut;
  document.getElementById("m-rover").textContent=money(rover);
  document.getElementById("m-fee").textContent="−"+money(fee);
  document.getElementById("m-direct").textContent=money(direct);
  document.getElementById("m-tips").textContent=money(tips);
  document.getElementById("m-exp").textContent="−"+money(expTotal);
  document.getElementById("m-miles").textContent="−"+money(mileAmt);
  document.getElementById("m-miles-n").textContent=miles?"("+miles.toFixed(0)+" mi)":"";
  document.getElementById("m-net").textContent=money(net);

  // 6-month bars
  const now=new Date(), months=[];
  for(let i=5;i>=0;i--){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    const s=d.toISOString().split("T")[0];
    const e=new Date(d.getFullYear(),d.getMonth()+1,0).toISOString().split("T")[0];
    const v=bookings.filter(b=>!b.cancelled&&b.end>=s&&b.start<=e)
      .reduce((t,b)=>t+calc(b).net,0);
    months.push({l:d.toLocaleDateString("en-US",{month:"short"}),v});
  }
  const mx=Math.max(...months.map(m=>m.v),1);
  document.getElementById("m-bars").innerHTML= months.every(m=>!m.v)
    ? '<div class="empty">No income logged yet.</div>'
    : months.map(m=>'<div class="bar-row"><span class="bar-lbl">'+m.l+'</span>'+
        '<span class="bar-tr"><span class="bar-fl" style="width:'+(m.v/mx*100)+'%"></span></span>'+
        '<span class="bar-amt">'+money(m.v)+'</span></div>').join("");

  // top clients
  const byC={};
  bs.forEach(b=>{byC[b.clientId]=(byC[b.clientId]||0)+calc(b).net});
  const top=Object.keys(byC).map(id=>({c:clientOf(id),v:byC[id]}))
    .filter(x=>x.c).sort((p,q)=>q.v-p.v).slice(0,5);
  document.getElementById("m-top").innerHTML= top.length
    ? top.map(x=>'<div class="item" data-client="'+x.c.id+'">'+
        '<div class="av">'+esc(x.c.name.charAt(0).toUpperCase())+'</div>'+
        '<div class="item-b"><div class="item-t">'+esc(x.c.name)+'</div>'+
        '<div class="item-s">'+bs.filter(b=>b.clientId===x.c.id).length+' booking(s)</div></div>'+
        '<div class="item-r"><div class="item-amt">'+money(x.v)+'</div></div></div>').join("")
    : '<div class="empty">No bookings in this range.</div>';

  const items=ex.map(e=>({...e,kind:"exp"})).concat(tr.map(t=>({...t,kind:"trip"})))
    .sort((p,q)=>q.date.localeCompare(p.date)).slice(0,20);
  document.getElementById("exp-list").innerHTML= items.length
    ? items.map(i=>'<div class="item" data-'+(i.kind==="exp"?"exp":"trip")+'="'+i.id+'">'+
        '<div class="av" style="background:var(--bad-bg);color:var(--bad)">'+(i.kind==="exp"?"💳":"🚗")+'</div>'+
        '<div class="item-b"><div class="item-t">'+esc(i.kind==="exp"?(i.category||"Expense"):(i.purpose||"Drive"))+'</div>'+
        '<div class="item-s">'+fmtD(i.date)+(i.note?' · '+esc(i.note):'')+'</div></div>'+
        '<div class="item-r"><div class="item-amt neg">−'+
          money(i.kind==="exp"?i.amount:(i.miles*settings.mile))+'</div>'+
        '<div class="item-sub">'+(i.kind==="exp"?"expense":i.miles+" mi")+'</div></div></div>').join("")
    : '<div class="empty">No expenses logged.</div>';
  document.querySelectorAll("[data-exp]").forEach(el=>el.addEventListener("click",()=>
    addExpense(expenses.find(x=>x.id===el.dataset.exp))));
  document.querySelectorAll("[data-trip]").forEach(el=>el.addEventListener("click",()=>
    addTrip(trips.find(x=>x.id===el.dataset.trip))));
  wireRows();
}
const EXP_CATS=["Supplies","Treats & food","Gas","Grooming","Insurance","Marketing","Other"];
function addExpense(e){
  e=e||{};
  openSheet(e.id?"Edit expense":"Add expense",
    '<label class="lbl">Amount</label><input class="in" type="number" step="0.01" id="e-amt" value="'+(e.amount||"")+'"/>'+
    '<label class="lbl">Category</label><select class="in" id="e-cat">'+
      EXP_CATS.map(c=>'<option'+(e.category===c?" selected":"")+'>'+c+'</option>').join("")+'</select>'+
    '<label class="lbl">Date</label><input class="in" type="date" id="e-date" value="'+(e.date||today())+'"/>'+
    '<label class="lbl">Note</label><input class="in" id="e-note" value="'+esc(e.note||"")+'"/>'+
    '<div class="err" id="e-err"></div><button class="btn" id="e-save">Save</button>'+
    (e.id?'<button class="btn danger" id="e-del" style="margin-top:8px">Delete</button>':''));
  document.getElementById("e-save").addEventListener("click",()=>{
    const amt=+document.getElementById("e-amt").value;
    if(!(amt>0)){document.getElementById("e-err").textContent="Enter an amount.";return}
    const rec={id:e.id||uid("e"),amount:amt,category:document.getElementById("e-cat").value,
      date:document.getElementById("e-date").value||today(),
      note:document.getElementById("e-note").value.trim()};
    if(e.id) expenses=expenses.map(x=>x.id===rec.id?rec:x); else expenses.push(rec);
    set("expenses",expenses); closeSheet(); renderMoney(); toast("Saved");
  });
  const d=document.getElementById("e-del");
  if(d) d.addEventListener("click",()=>{
    expenses=expenses.filter(x=>x.id!==e.id); set("expenses",expenses);
    closeSheet(); renderMoney(); toast("Deleted")});
}
function addTrip(t){
  t=t||{};
  openSheet(t.id?"Edit mileage":"Log mileage",
    '<label class="lbl">Miles</label><input class="in" type="number" step="0.1" id="t-mi" value="'+(t.miles||"")+'"/>'+
    '<label class="lbl">Date</label><input class="in" type="date" id="t-date" value="'+(t.date||today())+'"/>'+
    '<label class="lbl">Purpose</label><input class="in" id="t-purp" value="'+esc(t.purpose||"")+'" placeholder="Drop-in at the Millers"/>'+
    '<div class="err" id="t-err"></div><button class="btn" id="t-save">Save</button>'+
    (t.id?'<button class="btn danger" id="t-del" style="margin-top:8px">Delete</button>':''));
  document.getElementById("t-save").addEventListener("click",()=>{
    const mi=+document.getElementById("t-mi").value;
    if(!(mi>0)){document.getElementById("t-err").textContent="Enter the miles driven.";return}
    const rec={id:t.id||uid("t"),miles:mi,date:document.getElementById("t-date").value||today(),
      purpose:document.getElementById("t-purp").value.trim()};
    if(t.id) trips=trips.map(x=>x.id===rec.id?rec:x); else trips.push(rec);
    set("trips",trips); closeSheet(); renderMoney(); toast("Saved");
  });
  const d=document.getElementById("t-del");
  if(d) d.addEventListener("click",()=>{
    trips=trips.filter(x=>x.id!==t.id); set("trips",trips);
    closeSheet(); renderMoney(); toast("Deleted")});
}
document.getElementById("add-exp-btn").addEventListener("click",()=>addExpense());
document.getElementById("add-trip-btn").addEventListener("click",()=>addTrip());

// ── SETTINGS ───────────────────────────────────────────────────────────
function renderSet(){
  document.getElementById("r-board").value=settings.board;
  document.getElementById("r-house").value=settings.house;
  document.getElementById("r-drop").value=settings.drop;
  document.getElementById("r-walk").value=settings.walk;
  document.getElementById("r-day").value=settings.day;
  document.getElementById("r-cut").value=settings.cut;
  document.getElementById("r-mile").value=settings.mile;
  document.getElementById("s-biz").value=biz.name||"";
  document.getElementById("s-contact").value=biz.contact||"";
  document.getElementById("s-pay").value=biz.pay||"";
  document.getElementById("build-tag").textContent=BUILD;
  document.getElementById("db-info").innerHTML=
    clients.length+" clients · "+dogs.length+" dogs · "+bookings.length+" bookings<br>"+
    "Saved on this device. Last change "+(DB.__u?new Date(DB.__u).toLocaleString():"—");
}
document.getElementById("save-set").addEventListener("click",()=>{
  const cut=+document.getElementById("r-cut").value;
  if(cut<0||cut>100){toast("Rover cut must be 0–100%");return}
  settings={board:+document.getElementById("r-board").value||0,
    house:+document.getElementById("r-house").value||0,
    drop:+document.getElementById("r-drop").value||0,
    walk:+document.getElementById("r-walk").value||0,
    day:+document.getElementById("r-day").value||0,
    cut:cut, mile:+document.getElementById("r-mile").value||0};
  set("settings",settings); renderMoney(); toast("Rates saved");
});
document.getElementById("save-biz").addEventListener("click",()=>{
  biz={name:document.getElementById("s-biz").value.trim(),
       contact:document.getElementById("s-contact").value.trim(),
       pay:document.getElementById("s-pay").value.trim()};
  set("biz",biz); toast("Saved");
});
document.getElementById("exp-btn").addEventListener("click",()=>{
  try{
    const blob=new Blob([JSON.stringify({...DB,__exported:new Date().toISOString()},null,2)],
      {type:"application/json"});
    const url=URL.createObjectURL(blob), a=document.createElement("a");
    a.href=url; a.download="pack-backup-"+today()+".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    toast("Backup downloaded");
  }catch(e){toast("Export failed")}
});
document.getElementById("imp-btn").addEventListener("click",()=>
  document.getElementById("imp-file").click());
document.getElementById("imp-file").addEventListener("change",ev=>{
  const f=ev.target.files&&ev.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=e=>{
    try{
      const p=JSON.parse(e.target.result);
      const d=p&&p.data?p.data:p;
      if(!d||typeof d!=="object")throw new Error("bad file");
      DB.data={...DB.data,...d}; dbFlush();
      toast("Backup restored"); setTimeout(()=>location.reload(),700);
    }catch(err){toast("That file isn't a valid backup")}
  };
  r.onerror=()=>toast("Couldn't read that file");
  r.readAsText(f);
});
document.getElementById("wipe-btn").addEventListener("click",()=>{
  if(!confirm("Erase all clients, bookings and money records? Download a backup first — this can't be undone."))return;
  suppressFlush=true; DB=null; localStorage.removeItem(DB_KEY); location.reload();
});

// ── FAB ────────────────────────────────────────────────────────────────
document.getElementById("fab").addEventListener("click",()=>{
  const tab=document.querySelector(".tab.on").dataset.tab;
  if(tab==="clients") addClient();
  else addBooking(null,null);
});

// ── BOOT ───────────────────────────────────────────────────────────────
(function(){
  try{
    loadAll();
    renderHome(); renderCal(); renderSet();
    const n=clients.length+bookings.length;
    document.getElementById("hdr-sub").textContent =
      n ? clients.length+" clients" : "Dog sitting";
  }catch(e){
    console.error("Boot error:",e);
    document.getElementById("home-stats").innerHTML=
      '<div class="empty">Something went wrong starting up. '+
      'Try Settings → Restore backup.</div>';
  }
})();
</script>
